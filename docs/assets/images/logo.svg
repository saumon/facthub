<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fh-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#bg-gradient)"/>
  <rect x="6" y="6" width="108" height="108" rx="24" stroke="#c4b5fd" stroke-width="1" stroke-opacity="0.2" fill="none"/>
  <!-- FH monogram — both verticals full height, top bar short (F), middle crossbar full (H) -->
  <path d="M30 24H65V38H45V51H75V24H90V90H75V65H45V90H30Z" fill="url(#fh-gradient)"/>
  <!-- Sparkle top-right -->
  <path d="M99 20c1.2 3.6 2.4 4.8 6 6-3.6 1.2-4.8 2.4-6 6-1.2-3.6-2.4-4.8-6-6 3.6-1.2 4.8-2.4 6-6z" fill="url(#sparkle-gradient)" filter="url(#glow)"/>
  <!-- Sparkle bottom-left -->
  <path d="M14 88c1 3 2 4 5 5-3 1-4 2-5 5-1-3-2-4-5-5 3-1 4-2 5-5z" fill="url(#sparkle-gradient)" opacity="0.65" filter="url(#glow)"/>
  <!-- Sparkle top-left — tiny -->
  <path d="M18 32c.7 2 1.3 2.7 3.3 3.3-2 .7-2.7 1.3-3.3 3.3-.7-2-1.3-2.7-3.3-3.3 2-.7 2.7-1.3 3.3-3.3z" fill="url(#sparkle-gradient)" opacity="0.4"/>
</svg>
