openapi: "3.1.0"

info:
  title: FactHub API
  description: Public REST API serving random fun facts.
  version: "1.1.0"
  contact:
    name: FactHub

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/facts/random:
    get:
      summary: Get a random fact
      description: Returns a single fun fact chosen at random from the catalog. No authentication required.
      operationId: getRandomFact
      tags:
        - Facts
      responses:
        "200":
          description: A random fun fact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fact"
              example:
                id: 42
                body: "Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that was still perfectly edible."
        "404":
          description: No facts are available in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "no_facts_available"
                message: "No fun facts are currently available."

  /api/facts/next:
    get:
      summary: Get the next sequential fact for a client
      description: |
        Returns the next fun fact in ascending id order for the specified eligible client.
        Each client has an independent cursor. After the last available fact is served,
        the sequence wraps back to the first available fact.
        No authentication beyond a valid `client_id` query parameter is required.
      operationId: getNextFact
      tags:
        - Facts
      parameters:
        - name: client_id
          in: query
          required: true
          description: Opaque identifier of an eligible client generated by the admin interface.
          schema:
            type: string
          example: "4f3c7f5d8d7a4c5e9a7b3d2c1e0f9a8b"
      responses:
        "200":
          description: The next sequential fun fact for the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fact"
              example:
                id: 2
                body: "Bananas are berries, but strawberries are not."
        "400":
          description: The `client_id` query parameter is missing or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "missing_client_id"
                message: "client_id is required."
        "404":
          description: |
            Either no eligible client matches the provided `client_id` (including deleted clients),
            or no facts are currently available in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknown_client:
                  summary: Unknown or deleted client
                  value:
                    error: "unknown_client"
                    message: "No eligible client matches the provided client_id."
                no_facts_available:
                  summary: Empty fact catalog
                  value:
                    error: "no_facts_available"
                    message: "No fun facts are currently available."

components:
  schemas:
    Fact:
      type: object
      required:
        - id
        - body
      properties:
        id:
          type: integer
          description: Unique identifier of the fun fact.
          example: 42
        body:
          type: string
          description: The fun fact text. Always non-empty.
          example: "Honey never spoils."

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code.
          example: "no_facts_available"
        message:
          type: string
          description: Human-readable error description.
          example: "No fun facts are currently available."
